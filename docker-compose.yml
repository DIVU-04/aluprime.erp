version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
      - JWT_SECRET=aluprime-erp-production-secret
      - DATABASE_PATH=/data/aluprime.db
    volumes:
      - erp-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '4200:80'
    depends_on:
      - backend

volumes:
  erp-data:
