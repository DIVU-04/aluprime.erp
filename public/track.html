<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1024" />
    <title>Track ride — RideNow</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="badge">Live ride tracker</p>
        <h1>RideNow Trip</h1>
        <p class="subtitle">Someone shared their ride with you. This page updates automatically.</p>
      </header>

      <section id="track-card" class="card">
        <div id="track-panel" class="status-panel empty">
          <p>Loading trip...</p>
        </div>
      </section>

      <section class="card">
        <h2>Live map</h2>
        <div id="map" class="map"></div>
      </section>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./track.js"></script>
  </body>
</html>
