<div class="page-header d-flex justify-content-between align-items-center">
  <div><h2>{{ title }}</h2><p class="text-muted mb-0" *ngIf="subtitle">{{ subtitle }}</p></div>
  <button class="btn btn-primary" (click)="openForm()"><i class="bi bi-plus-lg"></i> Add New</button>
</div>

<div class="card">
  <table class="table table-hover mb-0">
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col.label }}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td *ngFor="let col of columns">
          <span *ngIf="col.type === 'currency'">{{ formatCurrency(getValue(item, col.key)) }}</span>
          <span *ngIf="col.type === 'badge'" class="badge bg-info">{{ getValue(item, col.key) }}</span>
          <span *ngIf="!col.type || col.type === 'text' || col.type === 'date'">{{ getValue(item, col.key) }}</span>
        </td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-primary me-1" (click)="openForm(item)"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" (click)="delete(item.id)"><i class="bi bi-trash"></i></button>
        </td>
      </tr>
      <tr *ngIf="items.length === 0">
        <td [attr.colspan]="columns.length + 1" class="text-center text-muted py-4">No records found</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-backdrop" *ngIf="showForm" (click)="showForm=false"></div>
<div class="modal-dialog-custom" *ngIf="showForm">
  <div class="card">
    <div class="card-header d-flex justify-content-between">
      <span>{{ formData['id'] ? 'Edit' : 'Add' }} {{ title }}</span>
      <button class="btn-close" (click)="showForm=false"></button>
    </div>
    <div class="card-body">
      <div class="mb-2" *ngFor="let field of fields">
        <label class="form-label">{{ field.label }}</label>
        <select *ngIf="field.type === 'select'" class="form-select" [(ngModel)]="formData[field.key]">
          <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
        </select>
        <input *ngIf="field.type !== 'select'" class="form-control"
          [type]="field.type || 'text'" [(ngModel)]="formData[field.key]">
      </div>
      <button class="btn btn-primary" (click)="save()">Save</button>
    </div>
  </div>
</div>
